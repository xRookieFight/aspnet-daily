<!doctype html> <!-- inanılmaz çirkin bir site ama çalışıyor -->
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yapılacaklar</title>
</head>
<body>
<main class="app">
    <header class="app-header">
        <h1>Yapılacaklar</h1>
        <p id="summary" class="summary"></p>
    </header>

    <form id="new-todo" class="new-todo" autocomplete="off">
        <input id="new-title" name="title" type="text" placeholder="Ne yapılacak?" maxlength="200" required>
        <input id="new-description" name="description" type="text" placeholder="Açıklama (isteğe bağlı)" maxlength="1000">
        <button type="submit">Ekle</button>
    </form>

    <nav class="filters" aria-label="Filtre">
        <button type="button" data-filter="all" class="active">Tümü</button>
        <button type="button" data-filter="active">Aktif</button>
        <button type="button" data-filter="done">Tamamlanan</button>
    </nav>

    <p id="error" class="error" role="alert" hidden></p>

    <ul id="todo-list" class="todo-list"></ul>
    <p id="empty" class="empty" hidden>Burada hiçbir şey yok.</p>
</main>

<template id="todo-template">
    <li class="todo">
        <input class="toggle" type="checkbox" aria-label="Tamamlandı">
        <div class="body">
            <span class="title"></span>
            <span class="description"></span>
        </div>
        <div class="actions">
            <button type="button" class="edit">Düzenle</button>
            <button type="button" class="delete">Sil</button>
        </div>
    </li>
</template>

<script src="js/app.js"></script>
</body>
</html>
